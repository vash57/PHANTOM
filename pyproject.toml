[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-exe"
version = "1.0.0"
description = "A local-first AI developer companion with a haunted terminal UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PHANTOM.exe contributors" }]
keywords = ["ollama", "terminal", "ai", "developer-tools", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = ["rich>=13.7.0,<15.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phantom = "phantom:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["phantom", "config"]

[tool.setuptools.package-data]
src = ["assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
